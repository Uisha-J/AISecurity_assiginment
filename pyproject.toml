[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_defense"
version = "0.1.0"
description = "Voice deepfake attack (red team) and defense (blue team) simulation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research and educational use" }

# Core runtime dependencies. Heavy/optional model deps live in [project.optional-dependencies].
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "transformers>=4.35",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyloudnorm>=0.1.1",
    "seaborn>=0.12",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Real speaker verification (ECAPA-TDNN) for measured ASR.
asr = ["speechbrain>=0.5.16"]
# Real voice-cloning attack zoo (heavy installs, GPU recommended).
attack-zoo = ["TTS", "openvoice", "bark"]
# Extra post-processing / mic demo.
extras = ["pyrubberband", "pesq", "pyaudio>=0.2.14"]
# Everything for real end-to-end runs.
full = ["speechbrain>=0.5.16", "TTS", "openvoice", "bark", "pyrubberband", "pesq", "pyaudio>=0.2.14"]
# Test tooling.
test = ["pytest>=7.0"]

[project.scripts]
voice-defense-simulate = "voice_defense.scripts.run_simulation:main"
voice-defense-asv-bypass = "voice_defense.scripts.run_asv_bypass:main"
voice-defense-train = "voice_defense.scripts.train:main"
voice-defense-evaluate = "voice_defense.scripts.evaluate:main"

# The source uses a flat layout: top-level packages live at the repo root, and
# `voice_defense/__init__.py` re-exposes them as `voice_defense.<pkg>` via __path__.
# Both the real top-level packages and the `voice_defense` shim are installed.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "voice_defense*",
    "attack*",
    "defense*",
    "common*",
    "evaluation*",
    "pipeline*",
    "scripts*",
]
exclude = ["tests*", "data*", "docs*", "outputs*", "configs*", "protocols*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
