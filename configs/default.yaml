# Default training configuration

seed: 1337
device: cuda  # falls back to cpu if unavailable

data:
  sample_rate: 16000
  segment_seconds: 4.0          # crop length during training
  train_protocol: protocols/seen.yaml
  dev_protocol: protocols/dev.yaml
  num_workers: 4
  batch_size: 24

  # Sources to mix during training. Each entry is a list of (wav_dir, label).
  bonafide_dirs:
    - data/bonafide/voxceleb_train
    - data/bonafide/librispeech_train
  spoof_dirs:
    - data/spoof_known/asvspoof5_train
    - data/spoof_known/mlaad_train
    - data/spoof_self/train       # generated by attack_zoo

augmentation:
  codec:
    enabled: true
    prob: 0.5
    codecs: [opus, mp3, g711_alaw, g711_ulaw]
  rir:
    enabled: true
    prob: 0.3
    rir_dir: data/augment/rirs
  noise:
    enabled: true
    prob: 0.4
    noise_dir: data/augment/musan
    snr_db: [5, 20]
  rawboost:
    enabled: true
    prob: 0.5
    algo: [1, 2, 3]   # see RawBoost paper

model:
  frontend:
    name: wavlm           # one of: wavlm, wav2vec2, xlsr
    pretrained: microsoft/wavlm-base-plus
    freeze: true
    output_layer_weighted: true
  backend:
    name: aasist
    gat_dim: 64
    n_heads: 4
    pool_dim: 128
  loss:
    name: oc_softmax
    feat_dim: 128
    r_real: 0.9
    r_fake: 0.2
    alpha: 20.0

training:
  epochs: 30
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 1
  grad_clip: 5.0
  log_every: 50
  ckpt_dir: checkpoints
  early_stop_patience: 5

evaluation:
  protocols:
    - protocols/seen.yaml
    - protocols/unseen.yaml
    - protocols/wild.yaml
  metrics: [eer, min_tdcf]
  report_dir: reports
